<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydro Wave Tank - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.pb-liquid-wave {
  --size: 240px;
  --color: #0ea5e9;
  --track: rgba(14, 165, 233, 0.16);
  --height: 18px;
  width: var(--size);
  max-width: 100%;
  height: var(--height);
  background-color: var(--track);
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}

.pb-liquid-body {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, rgba(14, 165, 233, 0.5) 0%, var(--color) 100%);
  border-radius: 9999px;
  overflow: hidden;
}

.pb-wave {
  position: absolute;
  width: 200%;
  height: 200%;
  top: -120%;
  left: -50%;
  background-color: rgba(255, 255, 255, 0.35);
  border-radius: 40%;
  animation: pbWaveRotate 3s linear infinite;
}

.pb-wave.wave2 {
  background-color: rgba(255, 255, 255, 0.18);
  border-radius: 36%;
  animation: pbWaveRotate 4.5s linear infinite reverse;
}

@keyframes pbWaveRotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-wave {
    animation: none;
    transform: rotate(20deg);
  }
}
  </style>
</head>
<body>
  <!-- Hydro Wave Tank (Progress Bars) -->
  <div class="pb-liquid-wave" role="progressbar" aria-label="Liquid capacity">
  <div class="pb-liquid-body">
    <div class="pb-wave wave1"></div>
    <div class="pb-wave wave2"></div>
  </div>
</div>
  <p class="demo-label">Hydro Wave Tank</p>
</body>
</html>
