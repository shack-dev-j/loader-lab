<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Tank - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.pb-liquid-wave {
  --size: 240px;
  --color: #0284c7;
  --track: rgba(255, 255, 255, 0.08);
  --height: 16px;
  width: var(--size);
  max-width: 100%;
  height: var(--height);
  background: var(--track);
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
}

.pb-liquid-body {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  background: var(--color);
  border-radius: 9999px;
  overflow: hidden;
}

.pb-wave {
  position: absolute;
  width: 200%;
  height: 200%;
  top: -120%;
  left: -50%;
  background: rgba(255, 255, 255, 0.3);
  border-radius: 40%;
  animation: pbWave 3s linear infinite;
}

.pb-wave.wave2 {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 36%;
  animation: pbWave 4.5s linear infinite reverse;
}

@keyframes pbWave {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-wave {
    animation: none;
    transform: rotate(20deg);
  }
}
  </style>
</head>
<body>
  <div class="pb-liquid-wave" role="progressbar" aria-label="Liquid capacity">
  <div class="pb-liquid-body">
    <div class="pb-wave wave1"></div>
    <div class="pb-wave wave2"></div>
  </div>
</div>
  <p class="demo-label">Liquid Tank</p>
</body>
</html>
