<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonar Pulse - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.sp-pulse {
  --size: 46px;
  --color: #10b981;
  width: var(--size);
  height: var(--size);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sp-pulse-ring {
  position: absolute;
  inset: 0;
  border: 2px solid var(--color);
  border-radius: 50%;
  opacity: 0;
  animation: spPulse 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
}

.sp-pulse-ring:nth-child(2) { animation-delay: 0.6s; }
.sp-pulse-ring:nth-child(3) { animation-delay: 1.2s; }

@keyframes spPulse {
  0% { transform: scale(0.1); opacity: 1; }
  70% { opacity: 0.5; }
  100% { transform: scale(1.15); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .sp-pulse-ring {
    animation: none;
    transform: scale(0.85);
    opacity: 0.4;
  }
}
  </style>
</head>
<body>
  <div class="sp-pulse" role="status" aria-label="Loading">
  <div class="sp-pulse-ring"></div>
  <div class="sp-pulse-ring"></div>
  <div class="sp-pulse-ring"></div>
</div>
  <p class="demo-label">Sonar Pulse</p>
</body>
</html>
