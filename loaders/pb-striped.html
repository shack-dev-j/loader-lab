<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Striped Stream - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.pb-striped {
  --size: 240px;
  --color: #10b981;
  --track: rgba(255, 255, 255, 0.08);
  --height: 12px;
  width: var(--size);
  max-width: 100%;
  height: var(--height);
  background: var(--track);
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
}

.pb-striped-track {
  position: absolute;
  top: 0;
  left: 0;
  width: calc(100% + 40px);
  height: 100%;
  background-image: repeating-linear-gradient(
    -45deg,
    var(--color),
    var(--color) 10px,
    rgba(255, 255, 255, 0.22) 10px,
    rgba(255, 255, 255, 0.22) 20px
  );
  animation: pbStriped 1.1s linear infinite;
}

@keyframes pbStriped {
  0% { transform: translateX(0); }
  100% { transform: translateX(-28px); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-striped-track {
    animation: none;
  }
}
  </style>
</head>
<body>
  <div class="pb-striped" role="progressbar" aria-label="Processing request">
  <div class="pb-striped-track"></div>
</div>
  <p class="demo-label">Striped Stream</p>
</body>
</html>
