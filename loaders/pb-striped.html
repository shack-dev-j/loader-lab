<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barber Stripe Stream - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.pb-striped {
  --size: 240px;
  --color: #059669;
  --track: rgba(5, 150, 105, 0.18);
  --height: 14px;
  width: var(--size);
  max-width: 100%;
  height: var(--height);
  background-color: var(--track);
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}

.pb-striped-track {
  position: absolute;
  top: 0;
  left: 0;
  width: calc(100% + 40px);
  height: 100%;
  background-image: repeating-linear-gradient(
    -45deg,
    var(--color),
    var(--color) 12px,
    rgba(255, 255, 255, 0.3) 12px,
    rgba(255, 255, 255, 0.3) 24px
  );
  animation: pbStripedAnim 1s linear infinite;
}

@keyframes pbStripedAnim {
  0% { transform: translateX(0); }
  100% { transform: translateX(-34px); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-striped-track {
    animation: none;
  }
}
  </style>
</head>
<body>
  <!-- Barber Stripe Stream (Progress Bars) -->
  <div class="pb-striped" role="progressbar" aria-label="Processing request">
  <div class="pb-striped-track"></div>
</div>
  <p class="demo-label">Barber Stripe Stream</p>
</body>
</html>
