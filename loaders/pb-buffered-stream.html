<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buffer Stream - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.pb-buffered-stream {
  --size: 240px;
  --color: #e11d48;
  --track: rgba(255, 255, 255, 0.08);
  --buf-color: rgba(225, 29, 72, 0.3);
  --height: 5px;
  width: var(--size);
  max-width: 100%;
  height: var(--height);
  background: var(--track);
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
}

.pb-buf-preload {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 75%;
  background: var(--buf-color);
  border-radius: 9999px;
  transform-origin: left center;
  animation: pbPreload 2s ease-in-out infinite;
}

.pb-buf-play {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 40%;
  background: var(--color);
  border-radius: 9999px;
  transform-origin: left center;
  animation: pbPlayhead 2.4s linear infinite;
}

@keyframes pbPreload {
  0%, 100% { opacity: 0.4; transform: scaleX(0.7); }
  50% { opacity: 0.8; transform: scaleX(0.85); }
}

@keyframes pbPlayhead {
  0% { transform: scaleX(0.1); }
  50% { transform: scaleX(0.45); }
  100% { transform: scaleX(0.8); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-buf-preload,
  .pb-buf-play {
    animation: none;
    transform: scaleX(0.5);
  }
}
  </style>
</head>
<body>
  <div class="pb-buffered-stream" role="progressbar" aria-label="Media buffering">
  <div class="pb-buf-preload"></div>
  <div class="pb-buf-play"></div>
</div>
  <p class="demo-label">Buffer Stream</p>
</body>
</html>
