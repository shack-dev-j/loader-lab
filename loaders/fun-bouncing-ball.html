<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing Ball - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.fun-bouncing-ball {
  --size: 46px;
  --color: #ef4444;
  width: var(--size);
  height: calc(var(--size) * 1.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  position: relative;
}

.fun-ball {
  width: 20px;
  height: 20px;
  background: radial-gradient(circle at 35% 35%, #fca5a5 0%, var(--color) 70%);
  border-radius: 50%;
  animation: funBounce 0.85s cubic-bezier(0.28, 0.84, 0.42, 1) infinite alternate;
}

.fun-shadow {
  width: 22px;
  height: 4px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 50%;
  margin-top: 4px;
  animation: funShadow 0.85s cubic-bezier(0.28, 0.84, 0.42, 1) infinite alternate;
}

@keyframes funBounce {
  0% { transform: translateY(-34px) scale(0.9, 1.1); }
  85% { transform: translateY(0) scale(1, 1); }
  100% { transform: translateY(2px) scale(1.3, 0.65); }
}

@keyframes funShadow {
  0% { transform: scale(0.4); opacity: 0.15; }
  100% { transform: scale(1.1); opacity: 0.45; }
}

@media (prefers-reduced-motion: reduce) {
  .fun-ball,
  .fun-shadow {
    animation: none;
    transform: none;
  }
}
  </style>
</head>
<body>
  <div class="fun-bouncing-ball" role="status" aria-label="Bouncing ball">
  <div class="fun-ball"></div>
  <div class="fun-shadow"></div>
</div>
  <p class="demo-label">Bouncing Ball</p>
</body>
</html>
