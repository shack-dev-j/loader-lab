<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squash & Stretch Ball - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.fun-bouncing-ball {
  --size: 50px;
  --color: #ef4444;
  width: var(--size);
  height: calc(var(--size) * 1.3);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  box-sizing: border-box;
}

.fun-ball {
  width: 22px;
  height: 22px;
  background: radial-gradient(circle at 35% 35%, #fca5a5 0%, var(--color) 70%);
  border-radius: 50%;
  animation: funBallBounce 0.9s cubic-bezier(0.28, 0.84, 0.42, 1) infinite alternate;
}

.fun-shadow {
  width: 24px;
  height: 5px;
  background-color: rgba(0, 0, 0, 0.2);
  border-radius: 50%;
  margin-top: 4px;
  animation: funShadowScale 0.9s cubic-bezier(0.28, 0.84, 0.42, 1) infinite alternate;
}

@keyframes funBallBounce {
  0% { transform: translateY(-36px) scale(0.9, 1.1); }
  85% { transform: translateY(0) scale(1, 1); }
  100% { transform: translateY(2px) scale(1.35, 0.65); }
}

@keyframes funShadowScale {
  0% { transform: scale(0.4); opacity: 0.15; }
  100% { transform: scale(1.1); opacity: 0.45; }
}

@media (prefers-reduced-motion: reduce) {
  .fun-ball,
  .fun-shadow {
    animation: none;
    transform: none;
  }
}
  </style>
</head>
<body>
  <!-- Squash & Stretch Ball (Fun Loaders) -->
  <div class="fun-bouncing-ball" role="status" aria-label="Bouncing ball">
  <div class="fun-ball"></div>
  <div class="fun-shadow"></div>
</div>
  <p class="demo-label">Squash & Stretch Ball</p>
</body>
</html>
