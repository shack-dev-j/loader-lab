<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blastoff Space Rocket - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.fun-rocket {
  --size: 54px;
  --color: #f97316;
  width: var(--size);
  height: calc(var(--size) * 1.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  box-sizing: border-box;
}

.fun-rocket-ship {
  font-size: 26px;
  line-height: 1;
  animation: funRocketHover 1.5s ease-in-out infinite alternate;
  display: inline-block;
  transform-origin: center bottom;
}

.fun-rocket-flame {
  width: 10px;
  height: 16px;
  background: linear-gradient(180deg, #fef08a 0%, var(--color) 70%, transparent 100%);
  border-radius: 50% 50% 20% 20%;
  animation: funFlameFlicker 0.25s ease-in-out infinite alternate;
  margin-top: -2px;
}

.fun-rocket-smoke {
  display: flex;
  gap: 4px;
  margin-top: 2px;
}

.fun-rocket-puff {
  width: 6px;
  height: 6px;
  background-color: rgba(148, 163, 184, 0.4);
  border-radius: 50%;
  animation: funSmokePuff 0.8s ease-out infinite;
}

.fun-rocket-puff:nth-child(2) {
  animation-delay: 0.3s;
}

@keyframes funRocketHover {
  0% { transform: translateY(0) rotate(-2deg); }
  100% { transform: translateY(-8px) rotate(2deg); }
}

@keyframes funFlameFlicker {
  0% { transform: scaleY(0.75) scaleX(0.85); opacity: 0.8; }
  100% { transform: scaleY(1.3) scaleX(1.15); opacity: 1; }
}

@keyframes funSmokePuff {
  0% { transform: translateY(0) scale(0.6); opacity: 0.8; }
  100% { transform: translateY(12px) scale(1.6); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .fun-rocket-ship,
  .fun-rocket-flame,
  .fun-rocket-puff {
    animation: none;
    transform: none;
  }
}
  </style>
</head>
<body>
  <!-- Blastoff Space Rocket (Fun Loaders) -->
  <div class="fun-rocket" role="status" aria-label="Launching rocket">
  <div class="fun-rocket-ship">🚀</div>
  <div class="fun-rocket-flame"></div>
  <div class="fun-rocket-smoke">
    <div class="fun-rocket-puff"></div>
    <div class="fun-rocket-puff"></div>
  </div>
</div>
  <p class="demo-label">Blastoff Space Rocket</p>
</body>
</html>
