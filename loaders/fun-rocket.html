<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure CSS Rocket - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.fun-rocket {
  --size: 54px;
  --color: #f97316;
  width: var(--size);
  height: calc(var(--size) * 1.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.fun-rocket-body {
  position: relative;
  width: 18px;
  height: 38px;
  animation: funRocketHover 1.5s ease-in-out infinite alternate;
}

.fun-rocket-fuselage {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 28px;
  background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
  border-radius: 50% 50% 20% 20% / 70% 70% 20% 20%;
  box-shadow: inset -2px 0 3px rgba(0, 0, 0, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.fun-rocket-window {
  width: 6px;
  height: 6px;
  background: #0284c7;
  border-radius: 50%;
  border: 1px solid #94a3b8;
  margin-top: -4px;
}

.fun-rocket-fin {
  position: absolute;
  bottom: 10px;
  width: 6px;
  height: 12px;
  background: var(--color);
  z-index: 1;
}

.fun-rocket-fin.left {
  left: -5px;
  border-radius: 8px 0 0 2px;
  transform: skewY(-25deg);
}

.fun-rocket-fin.right {
  right: -5px;
  border-radius: 0 8px 2px 0;
  transform: skewY(25deg);
}

.fun-rocket-flame {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 8px;
  height: 12px;
  transform: translateX(-50%);
  background: linear-gradient(180deg, #fef08a 0%, var(--color) 70%, transparent 100%);
  border-radius: 50% 50% 20% 20%;
  animation: funFlame 0.25s ease-in-out infinite alternate;
  z-index: 1;
}

.fun-rocket-smoke {
  display: flex;
  gap: 4px;
  margin-top: 2px;
}

.smoke-puff {
  width: 6px;
  height: 6px;
  background: rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  animation: funSmoke 0.8s ease-out infinite;
}

.smoke-puff:nth-child(2) {
  animation-delay: 0.35s;
}

@keyframes funRocketHover {
  0% { transform: translateY(0) rotate(-2deg); }
  100% { transform: translateY(-6px) rotate(2deg); }
}

@keyframes funFlame {
  0% { transform: translateX(-50%) scaleY(0.75) scaleX(0.85); opacity: 0.8; }
  100% { transform: translateX(-50%) scaleY(1.3) scaleX(1.15); opacity: 1; }
}

@keyframes funSmoke {
  0% { transform: translateY(0) scale(0.6); opacity: 0.7; }
  100% { transform: translateY(10px) scale(1.6); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .fun-rocket-body,
  .fun-rocket-flame,
  .smoke-puff {
    animation: none;
    transform: none;
  }
}
  </style>
</head>
<body>
  <div class="fun-rocket" role="status" aria-label="Launching rocket">
  <div class="fun-rocket-body">
    <div class="fun-rocket-fuselage">
      <div class="fun-rocket-window"></div>
    </div>
    <div class="fun-rocket-fin left"></div>
    <div class="fun-rocket-fin right"></div>
    <div class="fun-rocket-flame"></div>
  </div>
  <div class="fun-rocket-smoke">
    <span class="smoke-puff"></span>
    <span class="smoke-puff"></span>
  </div>
</div>
  <p class="demo-label">Pure CSS Rocket</p>
</body>
</html>
