<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex Arms - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.sp-vortex {
  --size: 46px;
  --color: #a855f7;
  width: var(--size);
  height: var(--size);
  position: relative;
  animation: spVortex 1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
}

.sp-vortex-arm {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2.5px solid transparent;
  border-top-color: var(--color);
  border-left-color: rgba(168, 85, 247, 0.35);
}

.sp-vortex-arm:nth-child(2) { transform: rotate(60deg) scale(0.8); }
.sp-vortex-arm:nth-child(3) { transform: rotate(120deg) scale(0.6); }

@keyframes spVortex {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .sp-vortex {
    animation: none;
    transform: rotate(30deg);
  }
}
  </style>
</head>
<body>
  <div class="sp-vortex" role="status" aria-label="Loading">
  <div class="sp-vortex-arm"></div>
  <div class="sp-vortex-arm"></div>
  <div class="sp-vortex-arm"></div>
</div>
  <p class="demo-label">Vortex Arms</p>
</body>
</html>
