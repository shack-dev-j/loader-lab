<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Galaxy Vortex - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.sp-vortex {
  --size: 48px;
  --color: #a855f7;
  width: var(--size);
  height: var(--size);
  position: relative;
  box-sizing: border-box;
  animation: spVortexSpin 1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
}

.sp-vortex-arm {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: var(--color);
  border-left-color: rgba(168, 85, 247, 0.4);
}

.sp-vortex-arm:nth-child(2) { transform: rotate(60deg) scale(0.8); }
.sp-vortex-arm:nth-child(3) { transform: rotate(120deg) scale(0.6); }

@keyframes spVortexSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .sp-vortex {
    animation: none;
    transform: rotate(30deg);
  }
}
  </style>
</head>
<body>
  <!-- Spiral Galaxy Vortex (Spinners) -->
  <div class="sp-vortex" role="status" aria-label="Loading">
  <div class="sp-vortex-arm"></div>
  <div class="sp-vortex-arm"></div>
  <div class="sp-vortex-arm"></div>
</div>
  <p class="demo-label">Spiral Galaxy Vortex</p>
</body>
</html>
