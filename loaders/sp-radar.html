<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Scanner - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.sp-radar {
  --size: 48px;
  --color: #14b8a6;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  border: 1.5px solid rgba(20, 184, 166, 0.3);
  position: relative;
  overflow: hidden;
}

.sp-radar::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    transparent 280deg,
    rgba(20, 184, 166, 0.5) 360deg
  );
  animation: spRadar 1.5s linear infinite;
}

.sp-radar-blip {
  position: absolute;
  top: 25%;
  right: 25%;
  width: 4px;
  height: 4px;
  background: #ffffff;
  border-radius: 50%;
  box-shadow: 0 0 5px var(--color);
  animation: spBlip 1.5s ease-in-out infinite;
}

@keyframes spRadar {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes spBlip {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  40% { opacity: 1; transform: scale(1.3); }
  60% { opacity: 0.2; transform: scale(0.8); }
}

@media (prefers-reduced-motion: reduce) {
  .sp-radar::before,
  .sp-radar-blip {
    animation: none;
    opacity: 0.5;
  }
}
  </style>
</head>
<body>
  <div class="sp-radar" role="status" aria-label="Scanning">
  <div class="sp-radar-blip"></div>
</div>
  <p class="demo-label">Radar Scanner</p>
</body>
</html>
