<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Data Table - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.sk-shimmer {
  position: relative;
  overflow: hidden;
  background-color: var(--color, rgba(148, 163, 184, 0.22));
}

.sk-shimmer::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.35) 50%, transparent 100%);
  animation: skShimmerTranslate 1.6s infinite;
}

@keyframes skShimmerTranslate {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.sk-table {
  --size: 260px;
  --color: rgba(148, 163, 184, 0.22);
  width: var(--size);
  max-width: 100%;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid rgba(148, 163, 184, 0.15);
  box-sizing: border-box;
}

.sk-table-row {
  display: flex;
  gap: 10px;
  padding: 9px 12px;
  align-items: center;
  border-bottom: 1px solid rgba(148, 163, 184, 0.1);
}

.sk-table-row.header {
  background-color: rgba(255, 255, 255, 0.06);
}

.sk-table-cell { height: 11px; border-radius: 3px; }
.sk-table-cell.col-1 { flex: 2; }
.sk-table-cell.col-2 { flex: 3; }
.sk-table-cell.col-3 { flex: 1.5; }

@media (prefers-reduced-motion: reduce) {
  .sk-shimmer::after { animation: none; opacity: 0.1; }
}
  </style>
</head>
<body>
  <!-- Skeleton Data Table (Skeleton Screens) -->
  <div class="sk-table" role="status" aria-label="Loading data table">
  <div class="sk-table-row header">
    <div class="sk-shimmer sk-table-cell col-1"></div>
    <div class="sk-shimmer sk-table-cell col-2"></div>
    <div class="sk-shimmer sk-table-cell col-3"></div>
  </div>
  <div class="sk-table-row">
    <div class="sk-shimmer sk-table-cell col-1"></div>
    <div class="sk-shimmer sk-table-cell col-2"></div>
    <div class="sk-shimmer sk-table-cell col-3"></div>
  </div>
  <div class="sk-table-row">
    <div class="sk-shimmer sk-table-cell col-1"></div>
    <div class="sk-shimmer sk-table-cell col-2"></div>
    <div class="sk-shimmer sk-table-cell col-3"></div>
  </div>
</div>
  <p class="demo-label">Skeleton Data Table</p>
</body>
</html>
