<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Skeleton - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.sk-shimmer {
  position: relative;
  overflow: hidden;
  background: var(--color, rgba(255, 255, 255, 0.08));
}

.sk-shimmer::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.25) 50%, transparent 100%);
  animation: skShimmer 1.6s infinite;
}

@keyframes skShimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.sk-table {
  --size: 260px;
  --color: rgba(255, 255, 255, 0.08);
  width: var(--size);
  max-width: 100%;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-sizing: border-box;
}

.sk-table-row {
  display: flex;
  gap: 10px;
  padding: 8px 10px;
  align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.sk-table-row.header {
  background: rgba(255, 255, 255, 0.04);
}

.sk-table-cell { height: 10px; border-radius: 2px; }
.sk-table-cell.col-1 { flex: 2; }
.sk-table-cell.col-2 { flex: 3; }
.sk-table-cell.col-3 { flex: 1.5; }

@media (prefers-reduced-motion: reduce) {
  .sk-shimmer::after { animation: none; opacity: 0.1; }
}
  </style>
</head>
<body>
  <div class="sk-table" role="status" aria-label="Loading data table">
  <div class="sk-table-row header">
    <div class="sk-shimmer sk-table-cell col-1"></div>
    <div class="sk-shimmer sk-table-cell col-2"></div>
    <div class="sk-shimmer sk-table-cell col-3"></div>
  </div>
  <div class="sk-table-row">
    <div class="sk-shimmer sk-table-cell col-1"></div>
    <div class="sk-shimmer sk-table-cell col-2"></div>
    <div class="sk-shimmer sk-table-cell col-3"></div>
  </div>
  <div class="sk-table-row">
    <div class="sk-shimmer sk-table-cell col-1"></div>
    <div class="sk-shimmer sk-table-cell col-2"></div>
    <div class="sk-shimmer sk-table-cell col-3"></div>
  </div>
</div>
  <p class="demo-label">Table Skeleton</p>
</body>
</html>
