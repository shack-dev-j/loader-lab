<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morphing Geometric Shapes - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.sp-morph {
  --size: 42px;
  --color: #f59e0b;
  width: var(--size);
  height: var(--size);
  background-color: var(--color);
  border-radius: 8px;
  animation: spMorphSequence 2.4s ease-in-out infinite;
  box-sizing: border-box;
}

@keyframes spMorphSequence {
  0% { transform: rotate(0deg) scale(1); border-radius: 8px; }
  25% { transform: rotate(90deg) scale(0.7); border-radius: 50%; }
  50% { transform: rotate(180deg) scale(1); border-radius: 8px; }
  75% { transform: rotate(270deg) scale(0.7); border-radius: 50%; }
  100% { transform: rotate(360deg) scale(1); border-radius: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  .sp-morph {
    animation: none;
    transform: none;
  }
}
  </style>
</head>
<body>
  <!-- Morphing Geometric Shapes (Spinners) -->
  <div class="sp-morph" role="status" aria-label="Loading"></div>
  <p class="demo-label">Morphing Geometric Shapes</p>
</body>
</html>
