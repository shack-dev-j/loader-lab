<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Chat Bubble - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.fun-typing {
  --size: 64px;
  --color: #3b82f6;
  width: var(--size);
  height: calc(var(--size) * 0.58);
  background-color: rgba(59, 130, 246, 0.15);
  border: 1px solid rgba(59, 130, 246, 0.25);
  border-radius: 18px 18px 18px 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  box-sizing: border-box;
  position: relative;
}

.fun-typing .dot {
  width: 6px;
  height: 6px;
  background-color: var(--color);
  border-radius: 50%;
  animation: funTypingBounce 1.2s ease-in-out infinite;
}

.fun-typing .dot:nth-child(1) { animation-delay: 0s; }
.fun-typing .dot:nth-child(2) { animation-delay: 0.18s; }
.fun-typing .dot:nth-child(3) { animation-delay: 0.36s; }

@keyframes funTypingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-7px); opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .fun-typing .dot {
    animation: none;
    transform: none;
    opacity: 0.8;
  }
}
  </style>
</head>
<body>
  <!-- Typing Chat Bubble (Fun Loaders) -->
  <div class="fun-typing" role="status" aria-label="Typing message">
  <span class="dot"></span>
  <span class="dot"></span>
  <span class="dot"></span>
</div>
  <p class="demo-label">Typing Chat Bubble</p>
</body>
</html>
