<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Bubble - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.fun-typing {
  --size: 58px;
  --color: #3b82f6;
  width: var(--size);
  height: calc(var(--size) * 0.55);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px 14px 14px 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.fun-typing .dot {
  width: 5px;
  height: 5px;
  background: var(--color);
  border-radius: 50%;
  animation: funTyping 1.2s ease-in-out infinite;
}

.fun-typing .dot:nth-child(1) { animation-delay: 0s; }
.fun-typing .dot:nth-child(2) { animation-delay: 0.18s; }
.fun-typing .dot:nth-child(3) { animation-delay: 0.36s; }

@keyframes funTyping {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
  30% { transform: translateY(-6px); opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .fun-typing .dot {
    animation: none;
    transform: none;
    opacity: 0.8;
  }
}
  </style>
</head>
<body>
  <div class="fun-typing" role="status" aria-label="Typing message">
  <span class="dot"></span>
  <span class="dot"></span>
  <span class="dot"></span>
</div>
  <p class="demo-label">Typing Bubble</p>
</body>
</html>
