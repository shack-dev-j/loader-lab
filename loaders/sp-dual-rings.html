<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested Counter-Rings - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.sp-dual-rings {
  --size: 50px;
  --color: #06b6d4;
  --accent: #3b82f6;
  width: var(--size);
  height: var(--size);
  position: relative;
  box-sizing: border-box;
}

.sp-dual-outer {
  position: absolute;
  inset: 0;
  border: 3px solid transparent;
  border-top-color: var(--color);
  border-bottom-color: var(--color);
  border-radius: 50%;
  animation: spSpinClockwise 1.2s linear infinite;
}

.sp-dual-inner {
  position: absolute;
  inset: 8px;
  border: 3px solid transparent;
  border-left-color: var(--accent);
  border-right-color: var(--accent);
  border-radius: 50%;
  animation: spSpinCounter 0.8s linear infinite reverse;
}

@keyframes spSpinClockwise {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes spSpinCounter {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .sp-dual-outer,
  .sp-dual-inner {
    animation: none;
    transform: rotate(45deg);
  }
}
  </style>
</head>
<body>
  <!-- Nested Counter-Rings (Spinners) -->
  <div class="sp-dual-rings" role="status" aria-label="Loading">
  <div class="sp-dual-outer"></div>
  <div class="sp-dual-inner"></div>
</div>
  <p class="demo-label">Nested Counter-Rings</p>
</body>
</html>
