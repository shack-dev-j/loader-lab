<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Loop - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.sp-infinity {
  --size: 50px;
  --color: #ec4899;
  width: var(--size);
  height: calc(var(--size) * 0.55);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sp-infinity-node {
  width: calc(var(--size) * 0.45);
  height: calc(var(--size) * 0.45);
  border: 3.5px solid var(--color);
  border-radius: 50%;
  box-sizing: border-box;
  animation: spInfinity 1.4s ease-in-out infinite alternate;
}

.sp-infinity-node:last-child {
  animation-delay: -0.7s;
}

@keyframes spInfinity {
  0% { transform: scale(0.85); opacity: 0.5; }
  100% { transform: scale(1.15); opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .sp-infinity-node {
    animation: none;
    transform: none;
    opacity: 0.8;
  }
}
  </style>
</head>
<body>
  <div class="sp-infinity" role="status" aria-label="Loading">
  <div class="sp-infinity-node"></div>
  <div class="sp-infinity-node"></div>
</div>
  <p class="demo-label">Infinity Loop</p>
</body>
</html>
