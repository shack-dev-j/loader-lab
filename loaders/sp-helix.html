<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNA Oscillating Helix - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.sp-helix {
  --size: 48px;
  --color: #6366f1;
  width: var(--size);
  height: calc(var(--size) * 0.65);
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-sizing: border-box;
}

.sp-helix-bar {
  width: 4px;
  height: 100%;
  background-color: var(--color);
  border-radius: 9999px;
  animation: spHelixOscillate 1.2s ease-in-out infinite;
}

.sp-helix-bar:nth-child(1) { animation-delay: 0.0s; }
.sp-helix-bar:nth-child(2) { animation-delay: 0.15s; }
.sp-helix-bar:nth-child(3) { animation-delay: 0.3s; }
.sp-helix-bar:nth-child(4) { animation-delay: 0.45s; }
.sp-helix-bar:nth-child(5) { animation-delay: 0.6s; }

@keyframes spHelixOscillate {
  0%, 100% { transform: scaleY(0.25); opacity: 0.35; }
  50% { transform: scaleY(1); opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .sp-helix-bar {
    animation: none;
    transform: scaleY(0.7);
    opacity: 0.8;
  }
}
  </style>
</head>
<body>
  <!-- DNA Oscillating Helix (Spinners) -->
  <div class="sp-helix" role="status" aria-label="Loading">
  <span class="sp-helix-bar"></span>
  <span class="sp-helix-bar"></span>
  <span class="sp-helix-bar"></span>
  <span class="sp-helix-bar"></span>
  <span class="sp-helix-bar"></span>
</div>
  <p class="demo-label">DNA Oscillating Helix</p>
</body>
</html>
