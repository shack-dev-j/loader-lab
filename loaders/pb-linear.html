<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Flow - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.pb-linear {
  --size: 240px;
  --color: #3b82f6;
  --track: rgba(255, 255, 255, 0.08);
  --height: 6px;
  width: var(--size);
  max-width: 100%;
  height: var(--height);
  background: var(--track);
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
}

.pb-linear-bar {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  background: var(--color);
  border-radius: 9999px;
  transform-origin: left center;
  animation: pbLinear 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
}

@keyframes pbLinear {
  0% { transform: translateX(-100%) scaleX(0.2); }
  50% { transform: translateX(25%) scaleX(0.65); }
  100% { transform: translateX(200%) scaleX(0.2); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-linear-bar {
    animation: none;
    transform: translateX(0) scaleX(0.6);
  }
}
  </style>
</head>
<body>
  <div class="pb-linear" role="progressbar" aria-label="Loading content" aria-valuemin="0" aria-valuemax="100">
  <div class="pb-linear-bar"></div>
</div>
  <p class="demo-label">Linear Flow</p>
</body>
</html>
