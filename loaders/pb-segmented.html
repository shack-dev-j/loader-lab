<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segmented LED - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.pb-segmented {
  --size: 240px;
  --color: #f59e0b;
  --height: 10px;
  width: var(--size);
  max-width: 100%;
  height: var(--height);
  display: flex;
  gap: 4px;
}

.pb-segmented .seg {
  flex: 1;
  height: 100%;
  background: var(--color);
  border-radius: 2px;
  opacity: 0.15;
  animation: pbSegment 1.4s ease-in-out infinite;
}

.pb-segmented .seg:nth-child(1) { animation-delay: 0.0s; }
.pb-segmented .seg:nth-child(2) { animation-delay: 0.12s; }
.pb-segmented .seg:nth-child(3) { animation-delay: 0.24s; }
.pb-segmented .seg:nth-child(4) { animation-delay: 0.36s; }
.pb-segmented .seg:nth-child(5) { animation-delay: 0.48s; }
.pb-segmented .seg:nth-child(6) { animation-delay: 0.60s; }
.pb-segmented .seg:nth-child(7) { animation-delay: 0.72s; }
.pb-segmented .seg:nth-child(8) { animation-delay: 0.84s; }

@keyframes pbSegment {
  0%, 100% { opacity: 0.15; transform: scaleY(0.8); }
  50% { opacity: 1; transform: scaleY(1); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-segmented .seg {
    animation: none;
    opacity: 0.7;
    transform: none;
  }
}
  </style>
</head>
<body>
  <div class="pb-segmented" role="progressbar" aria-label="Loading progress">
  <span class="seg"></span>
  <span class="seg"></span>
  <span class="seg"></span>
  <span class="seg"></span>
  <span class="seg"></span>
  <span class="seg"></span>
  <span class="seg"></span>
  <span class="seg"></span>
</div>
  <p class="demo-label">Segmented LED</p>
</body>
</html>
