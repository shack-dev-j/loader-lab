<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Feed List - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.sk-shimmer {
  position: relative;
  overflow: hidden;
  background-color: var(--color, rgba(148, 163, 184, 0.22));
}

.sk-shimmer::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.35) 50%, transparent 100%);
  animation: skShimmerTranslate 1.6s infinite;
}

@keyframes skShimmerTranslate {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.sk-list {
  --size: 260px;
  --color: rgba(148, 163, 184, 0.22);
  width: var(--size);
  max-width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-sizing: border-box;
}

.sk-list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px;
  border-radius: 8px;
  background-color: rgba(255, 255, 255, 0.03);
}

.sk-list-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
.sk-list-content { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.sk-list-line-primary { width: 80%; height: 12px; border-radius: 4px; }
.sk-list-line-secondary { width: 50%; height: 10px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  .sk-shimmer::after { animation: none; opacity: 0.1; }
}
  </style>
</head>
<body>
  <!-- Skeleton Feed List (Skeleton Screens) -->
  <div class="sk-list" role="status" aria-label="Loading feed list">
  <div class="sk-list-item">
    <div class="sk-shimmer sk-list-avatar"></div>
    <div class="sk-list-content">
      <div class="sk-shimmer sk-list-line-primary"></div>
      <div class="sk-shimmer sk-list-line-secondary"></div>
    </div>
  </div>
  <div class="sk-list-item">
    <div class="sk-shimmer sk-list-avatar"></div>
    <div class="sk-list-content">
      <div class="sk-shimmer sk-list-line-primary"></div>
      <div class="sk-shimmer sk-list-line-secondary"></div>
    </div>
  </div>
</div>
  <p class="demo-label">Skeleton Feed List</p>
</body>
</html>
