<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed List Skeleton - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.sk-shimmer {
  position: relative;
  overflow: hidden;
  background: var(--color, rgba(255, 255, 255, 0.08));
}

.sk-shimmer::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.25) 50%, transparent 100%);
  animation: skShimmer 1.6s infinite;
}

@keyframes skShimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.sk-list {
  --size: 260px;
  --color: rgba(255, 255, 255, 0.08);
  width: var(--size);
  max-width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
}

.sk-list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.03);
}

.sk-list-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
.sk-list-content { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.sk-list-line-primary { width: 80%; height: 11px; border-radius: 3px; }
.sk-list-line-secondary { width: 50%; height: 9px; border-radius: 3px; }

@media (prefers-reduced-motion: reduce) {
  .sk-shimmer::after { animation: none; opacity: 0.1; }
}
  </style>
</head>
<body>
  <div class="sk-list" role="status" aria-label="Loading list">
  <div class="sk-list-item">
    <div class="sk-shimmer sk-list-avatar"></div>
    <div class="sk-list-content">
      <div class="sk-shimmer sk-list-line-primary"></div>
      <div class="sk-shimmer sk-list-line-secondary"></div>
    </div>
  </div>
  <div class="sk-list-item">
    <div class="sk-shimmer sk-list-avatar"></div>
    <div class="sk-list-content">
      <div class="sk-shimmer sk-list-line-primary"></div>
      <div class="sk-shimmer sk-list-line-secondary"></div>
    </div>
  </div>
</div>
  <p class="demo-label">Feed List Skeleton</p>
</body>
</html>
