<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Text - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.fun-wave-text {
  --size: 14px;
  --color: #a855f7;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: var(--size);
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--color);
  display: flex;
  align-items: center;
}

.fun-wave-text span {
  display: inline-block;
  animation: funLetter 1.4s ease-in-out infinite;
}

.fun-wave-text span:nth-child(1) { animation-delay: 0.0s; }
.fun-wave-text span:nth-child(2) { animation-delay: 0.1s; }
.fun-wave-text span:nth-child(3) { animation-delay: 0.2s; }
.fun-wave-text span:nth-child(4) { animation-delay: 0.3s; }
.fun-wave-text span:nth-child(5) { animation-delay: 0.4s; }
.fun-wave-text span:nth-child(6) { animation-delay: 0.5s; }
.fun-wave-text span:nth-child(7) { animation-delay: 0.6s; }
.fun-wave-text span:nth-child(8) { animation-delay: 0.7s; }
.fun-wave-text span:nth-child(9) { animation-delay: 0.8s; }
.fun-wave-text span:nth-child(10) { animation-delay: 0.9s; }

@keyframes funLetter {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(-6px); opacity: 1; text-shadow: 0 0 6px var(--color); }
}

@media (prefers-reduced-motion: reduce) {
  .fun-wave-text span {
    animation: none;
    transform: none;
    opacity: 0.85;
  }
}
  </style>
</head>
<body>
  <div class="fun-wave-text" role="status" aria-label="Loading">
  <span>L</span>
  <span>O</span>
  <span>A</span>
  <span>D</span>
  <span>I</span>
  <span>N</span>
  <span>G</span>
  <span>.</span>
  <span>.</span>
  <span>.</span>
</div>
  <p class="demo-label">Wave Text</p>
</body>
</html>
