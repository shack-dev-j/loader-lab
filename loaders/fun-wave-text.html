<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Wave Text - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.fun-wave-text {
  --size: 16px;
  --color: #8b5cf6;
  font-family: inherit;
  font-size: var(--size);
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--color);
  display: flex;
  align-items: center;
  box-sizing: border-box;
}

.fun-wave-text span {
  display: inline-block;
  animation: funLetterWave 1.4s ease-in-out infinite;
}

.fun-wave-text span:nth-child(1) { animation-delay: 0.0s; }
.fun-wave-text span:nth-child(2) { animation-delay: 0.1s; }
.fun-wave-text span:nth-child(3) { animation-delay: 0.2s; }
.fun-wave-text span:nth-child(4) { animation-delay: 0.3s; }
.fun-wave-text span:nth-child(5) { animation-delay: 0.4s; }
.fun-wave-text span:nth-child(6) { animation-delay: 0.5s; }
.fun-wave-text span:nth-child(7) { animation-delay: 0.6s; }
.fun-wave-text span:nth-child(8) { animation-delay: 0.7s; }
.fun-wave-text span:nth-child(9) { animation-delay: 0.8s; }
.fun-wave-text span:nth-child(10) { animation-delay: 0.9s; }

@keyframes funLetterWave {
  0%, 100% {
    transform: translateY(0);
    opacity: 0.5;
  }
  50% {
    transform: translateY(-8px);
    opacity: 1;
    text-shadow: 0 4px 8px rgba(139, 92, 246, 0.4);
  }
}

@media (prefers-reduced-motion: reduce) {
  .fun-wave-text span {
    animation: none;
    transform: none;
    opacity: 0.9;
  }
}
  </style>
</head>
<body>
  <!-- Kinetic Wave Text (Fun Loaders) -->
  <div class="fun-wave-text" role="status" aria-label="Loading text">
  <span>L</span>
  <span>O</span>
  <span>A</span>
  <span>D</span>
  <span>I</span>
  <span>N</span>
  <span>G</span>
  <span>.</span>
  <span>.</span>
  <span>.</span>
</div>
  <p class="demo-label">Kinetic Wave Text</p>
</body>
</html>
