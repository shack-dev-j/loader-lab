<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step Progress Nodes - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.pb-step-nodes {
  --size: 260px;
  --color: #0284c7;
  --track: rgba(2, 132, 199, 0.18);
  --node-size: 26px;
  width: var(--size);
  max-width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  box-sizing: border-box;
  padding: 6px 0;
}

.pb-step-line {
  position: absolute;
  left: calc(var(--node-size) / 2);
  right: calc(var(--node-size) / 2);
  top: 50%;
  height: 4px;
  background-color: var(--track);
  transform: translateY(-50%);
  z-index: 1;
  overflow: hidden;
  border-radius: 9999px;
}

.pb-step-line-fill {
  width: 100%;
  height: 100%;
  background-color: var(--color);
  transform-origin: left center;
  animation: pbStepLineAnim 2.4s ease-in-out infinite;
}

.pb-step-nodes .pb-node {
  width: var(--node-size);
  height: var(--node-size);
  border-radius: 50%;
  background-color: var(--track);
  color: #64748b;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  position: relative;
}

.pb-step-nodes .pb-node.active {
  background-color: var(--color);
  color: #ffffff;
}

.pb-step-nodes .pb-node.pulsing {
  background-color: var(--color);
  color: #ffffff;
  animation: pbNodePulse 1.2s ease-in-out infinite;
}

@keyframes pbStepLineAnim {
  0% { transform: scaleX(0.2); }
  50% { transform: scaleX(0.75); }
  100% { transform: scaleX(0.2); }
}

@keyframes pbNodePulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.4);
  }
  50% {
    transform: scale(1.15);
    box-shadow: 0 0 0 6px rgba(2, 132, 199, 0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .pb-step-line-fill,
  .pb-step-nodes .pb-node.pulsing {
    animation: none;
    transform: none;
    box-shadow: none;
  }
}
  </style>
</head>
<body>
  <!-- Step Progress Nodes (Progress Bars) -->
  <div class="pb-step-nodes" role="progressbar" aria-label="Step progress">
  <div class="pb-step-line">
    <div class="pb-step-line-fill"></div>
  </div>
  <div class="pb-node active">1</div>
  <div class="pb-node active">2</div>
  <div class="pb-node pulsing">3</div>
  <div class="pb-node">4</div>
</div>
  <p class="demo-label">Step Progress Nodes</p>
</body>
</html>
