<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step Checkpoints - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.pb-step-nodes {
  --size: 260px;
  --color: #0284c7;
  --track: rgba(255, 255, 255, 0.1);
  --node-size: 24px;
  width: var(--size);
  max-width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  padding: 4px 0;
}

.pb-step-line {
  position: absolute;
  left: calc(var(--node-size) / 2);
  right: calc(var(--node-size) / 2);
  top: 50%;
  height: 3px;
  background: var(--track);
  transform: translateY(-50%);
  z-index: 1;
  overflow: hidden;
  border-radius: 9999px;
}

.pb-step-line-fill {
  width: 100%;
  height: 100%;
  background: var(--color);
  transform-origin: left center;
  animation: pbStepLine 2.2s ease-in-out infinite;
}

.pb-step-nodes .pb-node {
  width: var(--node-size);
  height: var(--node-size);
  border-radius: 50%;
  background: var(--track);
  color: #94a3b8;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  position: relative;
}

.pb-step-nodes .pb-node.active {
  background: var(--color);
  color: #ffffff;
}

.pb-step-nodes .pb-node.pulsing {
  background: var(--color);
  color: #ffffff;
  animation: pbNodePulse 1.2s ease-in-out infinite;
}

@keyframes pbStepLine {
  0% { transform: scaleX(0.2); }
  50% { transform: scaleX(0.75); }
  100% { transform: scaleX(0.2); }
}

@keyframes pbNodePulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.4); }
  50% { transform: scale(1.12); box-shadow: 0 0 0 5px rgba(2, 132, 199, 0); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-step-line-fill,
  .pb-step-nodes .pb-node.pulsing {
    animation: none;
    transform: none;
    box-shadow: none;
  }
}
  </style>
</head>
<body>
  <div class="pb-step-nodes" role="progressbar" aria-label="Step progress">
  <div class="pb-step-line">
    <div class="pb-step-line-fill"></div>
  </div>
  <div class="pb-node active">1</div>
  <div class="pb-node active">2</div>
  <div class="pb-node pulsing">3</div>
  <div class="pb-node">4</div>
</div>
  <p class="demo-label">Step Checkpoints</p>
</body>
</html>
