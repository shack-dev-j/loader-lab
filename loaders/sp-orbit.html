<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planetary Core & Orbit - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.sp-orbit {
  --size: 48px;
  --color: #8b5cf6;
  width: var(--size);
  height: var(--size);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}

.sp-orbit-core {
  width: 14px;
  height: 14px;
  background-color: var(--color);
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
  animation: spOrbitPulse 1.8s ease-in-out infinite;
}

.sp-orbit-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px dashed rgba(139, 92, 246, 0.35);
  animation: spOrbitSpin 1.8s linear infinite;
}

.sp-orbit-satellite {
  position: absolute;
  top: -4px;
  left: calc(50% - 4px);
  width: 8px;
  height: 8px;
  background-color: var(--color);
  border-radius: 50%;
  box-shadow: 0 0 6px #c4b5fd;
}

@keyframes spOrbitSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes spOrbitPulse {
  0%, 100% { transform: scale(0.85); opacity: 0.8; }
  50% { transform: scale(1.15); opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .sp-orbit-ring,
  .sp-orbit-core {
    animation: none;
    transform: none;
  }
}
  </style>
</head>
<body>
  <!-- Planetary Core & Orbit (Spinners) -->
  <div class="sp-orbit" role="status" aria-label="Loading">
  <div class="sp-orbit-core"></div>
  <div class="sp-orbit-ring">
    <div class="sp-orbit-satellite"></div>
  </div>
</div>
  <p class="demo-label">Planetary Core & Orbit</p>
</body>
</html>
