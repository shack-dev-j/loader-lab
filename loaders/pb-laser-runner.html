<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Neon Runner - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.pb-laser-runner {
  --size: 240px;
  --color: #ec4899;
  --track: rgba(236, 72, 153, 0.15);
  --height: 4px;
  width: var(--size);
  max-width: 100%;
  height: var(--height);
  background-color: var(--track);
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}

.pb-laser-beam {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 35%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    var(--color) 50%,
    #f472b6 90%,
    #ffffff 100%
  );
  border-radius: 9999px;
  box-shadow: 0 0 10px var(--color), 0 0 4px #f472b6;
  animation: pbLaserSlide 1.5s ease-in-out infinite alternate;
}

@keyframes pbLaserSlide {
  0% { transform: translateX(0); }
  100% { transform: translateX(calc(var(--size) - 80px)); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-laser-beam {
    animation: none;
    transform: translateX(calc(var(--size) / 3));
  }
}
  </style>
</head>
<body>
  <!-- Cyber Neon Runner (Progress Bars) -->
  <div class="pb-laser-runner" role="progressbar" aria-label="Laser sync">
  <div class="pb-laser-beam"></div>
</div>
  <p class="demo-label">Cyber Neon Runner</p>
</body>
</html>
