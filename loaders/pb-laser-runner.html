<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Beam - Loader Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

.pb-laser-runner {
  --size: 240px;
  --color: #ec4899;
  --track: rgba(255, 255, 255, 0.08);
  --height: 4px;
  width: var(--size);
  max-width: 100%;
  height: var(--height);
  background: var(--track);
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
}

.pb-laser-beam {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 30%;
  background: linear-gradient(90deg, transparent 0%, var(--color) 60%, #ffffff 100%);
  border-radius: 9999px;
  box-shadow: 0 0 8px var(--color);
  animation: pbLaser 1.5s ease-in-out infinite alternate;
}

@keyframes pbLaser {
  0% { transform: translateX(0); }
  100% { transform: translateX(calc(var(--size) - 72px)); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-laser-beam {
    animation: none;
    transform: translateX(calc(var(--size) / 3));
  }
}
  </style>
</head>
<body>
  <div class="pb-laser-runner" role="progressbar" aria-label="Laser sync">
  <div class="pb-laser-beam"></div>
</div>
  <p class="demo-label">Laser Beam</p>
</body>
</html>
