<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faceted 3D Hourglass - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.sp-hourglass {
  --size: 44px;
  --color: #f97316;
  width: var(--size);
  height: var(--size);
  position: relative;
  box-sizing: border-box;
  animation: spHourglassFlip 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
}

.sp-hourglass::before,
.sp-hourglass::after {
  content: "";
  position: absolute;
  left: 50%;
  width: 0;
  height: 0;
  transform: translateX(-50%);
  border-left: calc(var(--size) * 0.35) solid transparent;
  border-right: calc(var(--size) * 0.35) solid transparent;
}

.sp-hourglass::before {
  top: 0;
  border-top: calc(var(--size) * 0.45) solid var(--color);
}

.sp-hourglass::after {
  bottom: 0;
  border-bottom: calc(var(--size) * 0.45) solid var(--color);
}

@keyframes spHourglassFlip {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(0.9); }
  100% { transform: rotate(360deg) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .sp-hourglass {
    animation: none;
    transform: rotate(45deg);
  }
}
  </style>
</head>
<body>
  <!-- Faceted 3D Hourglass (Spinners) -->
  <div class="sp-hourglass" role="status" aria-label="Loading"></div>
  <p class="demo-label">Faceted 3D Hourglass</p>
</body>
</html>
