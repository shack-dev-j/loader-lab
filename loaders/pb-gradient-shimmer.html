<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Shimmer Wave - Loader Lab</title>
  <style>
    /* Reset & Demo Centering Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    .demo-label {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* ======================================================
       LOADER CSS BLOCK (Self-contained, customize variables)
       ====================================================== */
.pb-gradient-shimmer {
  --size: 240px;
  --color: #7c3aed;
  --track: rgba(124, 58, 237, 0.16);
  --height: 10px;
  width: var(--size);
  max-width: 100%;
  height: var(--height);
  background-color: var(--track);
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}

.pb-shimmer-fill {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, var(--color) 0%, #c084fc 50%, var(--color) 100%);
  border-radius: 9999px;
  overflow: hidden;
}

.pb-shimmer-fill::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255, 255, 255, 0.8) 50%,
    transparent 100%
  );
  animation: pbShimmerSweep 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

@keyframes pbShimmerSweep {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

@media (prefers-reduced-motion: reduce) {
  .pb-shimmer-fill::after {
    animation: none;
    opacity: 0.3;
    transform: translateX(0);
  }
}
  </style>
</head>
<body>
  <!-- Gradient Shimmer Wave (Progress Bars) -->
  <div class="pb-gradient-shimmer" role="progressbar" aria-label="Loading buffer">
  <div class="pb-shimmer-fill"></div>
</div>
  <p class="demo-label">Gradient Shimmer Wave</p>
</body>
</html>
